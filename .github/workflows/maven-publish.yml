# This workflow builds a package with Maven and publishes it to GitHub Packages.
# For more information see: https://github.com/actions/setup-java/blob/main/docs/advanced-usage.md#apache-maven-with-a-settings-path

name: Maven Build and Publish with Deployment Management

on:
  push:
    branches:
      - releases/**

jobs:
  build:

    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
    outputs:
      build_version: ${{ steps.build-version-step.outputs.build_version }}
      build_artifact_id: ${{ steps.build-version-step.outputs.build_artifact_id }}
      build_group_id: ${{ steps.build-version-step.outputs.build_group_id }}

    steps:
    - uses: actions/checkout@v5
    - name: Set up JDK 25
      uses: actions/setup-java@v5
      with:
        java-version: '25'
        distribution: 'temurin'
        server-id: github # Value of the distributionManagement/repository/id field of the pom.xml
        settings-path: ${{ github.workspace }} # location for the settings.xml file

    # Generates and submits the deep Maven dependency tree to GitHub
    - name: Submit Dependency Snapshot
      uses: advanced-security/maven-dependency-submission-action@v6
      with:
        # Use the settings.xml configured in the setup-java step
        settings-file: ${{ github.workspace }}/settings.xml

    - name: Set build version
      id: build-version-step
      shell: bash
      run: |
        # Extract version by stripping the "releases/" prefix from the branch name
        release_version="${GITHUB_REF_NAME#releases/}"
        build_version="${release_version}.${GITHUB_RUN_NUMBER}"
        mvn -B versions:set -DnewVersion="$build_version" -DgenerateBackupPoms=false
        echo "build_version=$build_version" >> "$GITHUB_OUTPUT"
        build_artifact_id=$(mvn -q -Dexec.executable=echo -Dexec.args='${project.artifactId}' --non-recursive exec:exec)
        echo "build_artifact_id=$build_artifact_id" >> "$GITHUB_OUTPUT"
        build_group_id=$(mvn -q -Dexec.executable=echo -Dexec.args='${project.groupId}' --non-recursive exec:exec)
        echo "build_group_id=$build_group_id" >> "$GITHUB_OUTPUT"

    - name: Publish to GitHub Packages Apache Maven
      run: mvn -B -Dmaven.repository.routing=false deploy -s "$GITHUB_WORKSPACE/settings.xml"
      env:
        GITHUB_TOKEN: ${{ github.token }}

  # JOB 2: Automatically pull the JAR from Maven and deploy it to Dev
  dev-deploy:
    needs: build                # Ensures deployment only starts if Job 1 succeeds
    runs-on: ubuntu-24.04
    permissions:
      packages: read            # Grants permission to download packages from GitHub Packages
    
    steps:
    # We do NOT checkout the full codebase here. We only fetch the JAR binary.
    - name: Set up JDK 25
      uses: actions/setup-java@v5
      with:
        java-version: '25'
        distribution: 'temurin'
        server-id: github       # Generates credentials so Maven can authenticate to download
        settings-path: ${{ github.workspace }}

    - name: Download JAR from GitHub Packages
      shell: bash
      run: |
        echo "Fetching version ${{ needs.build.outputs.build_version }} from Maven..."
        
        # Download the JAR directly into the local workspace folder
        mvn dependency:get \
          -s "$GITHUB_WORKSPACE/settings.xml" \
          -DremoteRepositories=github::default::https://maven.pkg.github.com/rajkumarsrikanth/demo-thymeleaf \
          -Dartifact=${{ needs.build.outputs.build_group_id }}:${{ needs.build.outputs.build_artifact_id }}:${{ needs.build.outputs.build_version }} \
          -Dtransitive=false \
          -Ddest=$GITHUB_WORKSPACE/app.jar
      env:
        GITHUB_TOKEN: ${{ github.token }}
