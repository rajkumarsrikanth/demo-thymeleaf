name: "CodeQL Security Check"

on:
  push:
    branches: [ "main", "releases/**" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '30 4 * * 1' # Runs automatically every Monday at 4:30 AM

jobs:
  analyze:
    name: Analyze Code
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v5

    # Setup JDK to match your Maven build environment
    - name: Set up JDK 21
      uses: actions/setup-java@v5
      with:
        java-version: '25'
        distribution: 'temurin'
        cache: 'maven' # Caches Maven dependencies to make security scans faster

    # Initializes the CodeQL tools for scanning
    - name: Initialize CodeQL
      uses: github/codeql-action/init@v4
      with:
        languages: 'java-kotlin'
        # Employs extended security queries (includes OWASP Top 10 rules)
        queries: security-extended,security-and-quality

    # Explicitly compile the project so CodeQL can precisely trace the Java data flow
    - name: Compile Java Code for CodeQL
      run: |
        mvn clean compile -DskipTests -B

    # Perform the semantic security scan
    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v4
